name: Build YTUHD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl build-essential perl unzip xz-utils

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          bash $HOME/theos/bin/install-theos

      - name: Clone extra headers
        run: |
          mkdir -p $HOME/theos/include
          git clone https://github.com/PoomSmart/YouTubeHeader.git $HOME/theos/include/YouTubeHeader
          git clone https://github.com/PoomSmart/PSHeader.git $HOME/theos/include/PSHeader

      - name: Init all submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote

      - name: Build package
        run: |
          make package FINALPACKAGE=1

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ytuhd-deb
          path: packages/*.deb
